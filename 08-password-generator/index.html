<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back" href="../">← All projects</a>
  <main class="card">
    <h1>Password Generator</h1>
    <p class="subtitle">Made on your device with random values — nothing is sent anywhere.</p>
    <div class="output-row">
      <input id="password" type="text" readonly placeholder="Your password will appear here">
      <button id="copy">Copy</button>
    </div>
    <label>
      Length: <strong id="length-value">12</strong>
      <input id="length" type="range" min="6" max="32" value="12">
    </label>
    <label><input id="uppercase" type="checkbox" checked> Uppercase (A–Z)</label>
    <label><input id="lowercase" type="checkbox" checked> Lowercase (a–z)</label>
    <label><input id="numbers" type="checkbox" checked> Numbers (0–9)</label>
    <label><input id="symbols" type="checkbox"> Symbols (!@#$…)</label>
    <button id="generate" class="primary">Generate password</button>
    <p id="copied" hidden>Copied!</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
