<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back" href="../">← All projects</a>
  <main class="card">
    <h1>Rock Paper Scissors</h1>
    <p class="subtitle">Pick rock, paper, or scissors. The score keeps count.</p>
    <p id="score">You 0 — 0 Computer</p>
    <div class="choices">
      <button data-choice="rock">✊ Rock</button>
      <button data-choice="paper">✋ Paper</button>
      <button data-choice="scissors">✌️ Scissors</button>
    </div>
    <p id="result">Pick one to start.</p>
    <button id="reset">Reset score</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
